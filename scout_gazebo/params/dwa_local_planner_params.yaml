DWAPlannerROS:
  # Robot Configuration Parameters - Kobuki 机器人配置参数-Kobuki
  max_vel_x: 0.5                        # x方向最大线速度绝对值，单位：米/秒
  min_vel_x: -0.05                      # x方向最小线速度绝对值，单位:米/秒。如果为负值表示可以后退

  max_vel_y: 0.0                        # y方向最大线速度绝对值，单位:米/秒。turtlebot为差分驱动机器人，所以为0
  min_vel_y: 0.0                        # y方向最小线速度绝对值，单位:米/秒。turtlebot为差分驱动机器人，所以为0

  max_trans_vel: 0.5                    # 机器人最大平移速度的绝对值，单位为 m/s
  min_trans_vel: 0.1                    # 机器人最小平移速度的绝对值，单位为 m/s
  trans_stopped_vel: 0.1                # 机器人被认为"停止"状态时的平移速度，单位为 m/s
  # 注意不要将min_trans_vel设置为0，否则DWA认为平移速度不可忽略，将创建较小的旋转速度

  max_rot_vel: 0.55                     # 机器人的最大旋转角速度的绝对值，单位为 rad/s
  min_rot_vel: 0.35                     # 机器人的最小旋转角速度的绝对值，单位为 rad/s
  rot_stopped_vel: 0.4                  # 机器人被认为"停止"状态时的旋转速度，单位为 rad/s

  acc_lim_x: 2.0                        # 机器人在x方向的极限加速度，单位meters/sec^2
  acc_lim_theta: 4.0                    # 机器人的极限旋转加速度，单位为rad/sec^2
  acc_lim_y: 0.0                        # 机器人在y方向的极限加速度，对于差分机器人来说为0

  # Goal Tolerance Parameters 目标容差参数
  yaw_goal_tolerance: 0.1               # 到达目标点时偏航角允许的误差，单位弧度
  xy_goal_tolerance: 0.1                # 到达目标点时在xy平面内与目标点的距离误差，单位米
  # latch_xy_goal_tolerance: false     # 设置为true时表示：如果到达容错距离内,机器人就会原地旋转

  # Forward Simulation Parameters 正向仿真参数
  sim_time: 1.7                         # 前向模拟轨迹的时间，单位为s
  vx_samples: 6                         # x方向速度空间的采样点数
  vy_samples: 1                         # y方向速度空间采样点数，差分驱动机器人永远只有1个值（0.0）
  vtheta_samples: 20                    # 旋转方向的速度空间采样点数

  # Trajectory Scoring Parameters 轨迹评分参数
  path_distance_bias: 32.0              # 控制器与给定路径接近程度的权重
  goal_distance_bias: 24.0              # 控制器与局部目标点的接近程度的权重，也用于速度控制
  occdist_scale: 10.0                   # 控制器躲避障碍物的程度
  forward_point_distance: 0.325         # 以机器人为中心，额外放置一个计分点的距离
  stop_time_buffer: 0.2                 # 为防止碰撞，机器人必须提前停止的时间长度
  scaling_speed: 0.25                   # 开始缩放机器人足迹时的速度的绝对值，单位为m/s
  # 缩放因子计算：如果当前平移速度小于scaling_speed，则缩放因子为1.0，
  # 否则，缩放因子为(vmag - scaling_speed) / (max_trans_vel - scaling_speed) * max_scaling_factor + 1.0

  max_scaling_factor: 0.2               # 最大缩放因子
  turn_round_penalty: 6.0               # 转弯惩罚系数
  turn_round_scale: 1.0                 # 转弯缩放系数

  # Oscillation Prevention Parameters 防振参数
  oscillation_reset_dist: 0.05          # 机器人运动多远距离才会重置振荡标记

  # Debugging 调试参数
  publish_traj_pc: true                 # 将规划的轨迹在RVIZ上进行可视化
  publish_cost_grid_pc: false           # 将代价值进行可视化显示
  global_frame_id: odom                 # 全局参考坐标系为odom

  # Differential-drive robot configuration 差分机器人配置参数
  # holonomic_robot: false              # 是否为全向机器人。false为差分机器人；true为全向机器人
